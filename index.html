<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRIS Support Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23DC382D'/%3E%3Ctext x='16' y='16' text-anchor='middle' dominant-baseline='central' font-family='Arial,sans-serif' font-size='20' font-weight='700' fill='white'%3ER%3C/text%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d10;
      background-image: radial-gradient(ellipse 60% 40% at 80% 10%, #2a0d0d 0%, transparent 70%);
      color: #ffffff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 50%;
      margin: 0 auto;
      min-width: 400px;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    header h1 {
      white-space: nowrap;
      font-size: 15px;
      font-weight: 600;
      color: #e8e8e8;
    }

    .logo {
      height: 24px;
      width: auto;
      flex-shrink: 0;
    }

    /* Session controls */
    .session-bar {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
    }

    .session-bar label {
      font-size: 11px;
      color: #666;
      margin-right: 2px;
    }

    .session-bar input {
      background: #1c1c22;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      padding: 4px 8px;
      width: 120px;
      outline: none;
    }

    .session-bar input:focus {
      border-color: rgba(255,255,255,0.2);
    }

    #ok-btn {
      background: #7a1f1f;
      border: none;
      border-radius: 7px;
      color: #f0e8e8;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }

    #ok-btn:hover { background: #8f2525; }
    #ok-btn:active { background: #651a1a; }

    /* Disabled chat overlay */
    .chat-disabled {
      pointer-events: none;
      opacity: 0.35;
      user-select: none;
    }

    #session-prompt {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 13px;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a33 transparent;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #2a2a33; border-radius: 4px; }

    .bubble-row {
      display: flex;
      width: 100%;
    }

    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 68%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .bubble-row.user .bubble {
      background: #2b2320;
      border-bottom-right-radius: 4px;
      color: #f0f0f0;
    }

    .bubble-row.assistant .bubble {
      background: #1a1d26;
      border-bottom-left-radius: 4px;
      color: #e8e8e8;
    }

    /* Status / thinking bubble */
    .bubble.status {
      background: #1a1d26;
      color: #999;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }

    .bubble.status .dot-pulse {
      display: flex;
      gap: 3px;
    }

    .bubble.status .dot-pulse span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #666;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .bubble.status .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .bubble.status .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Badge for cache / faq / rejected */
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge.cache { background: #1a3a2a; color: #4caf8a; }
    .badge.faq { background: #1a2a3a; color: #6ab0f3; }
    .badge.rejected { background: #3a1a1a; color: #cf6679; }

    /* ── Input area ── */
    #input-area {
      flex-shrink: 0;
      padding: 12px 16px 16px;
    }

    .input-box {
      background: #141720;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 14px 40px;
      position: relative;
    }

    #user-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e8e8;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
      min-height: 48px;
      max-height: 160px;
    }

    #user-input::placeholder { color: #4a4a5a; }

    .input-footer {
      position: absolute;
      bottom: 10px;
      left: 14px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hint {
      font-size: 11px;
      color: #44445a;
      user-select: none;
    }

    #send-btn {
      background: #7a1f1f;
      border: none;
      border-radius: 9px;
      color: #f0e8e8;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }

    #send-btn:hover { background: #8f2525; }
    #send-btn:active { background: #651a1a; }
    #send-btn:disabled { background: #3a2020; color: #6a5050; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 85 27" role="img" aria-label="Redis">
    <path fill="#FF4438" fill-rule="evenodd" clip-rule="evenodd" d="M75.29 13.813c0-2.968 2.2-4.69 4.947-4.69 2.052 0 3.884.99 4.763 3.444-.257 1.245-1.795 2.638-2.455 2.858-.55-1.173-1.172-1.869-1.758-1.869-.733 0-.77.513-.77 1.172 0 .467.134 1.155.295 1.983.243 1.25.548 2.82.548 4.43 0 2.93-2.052 5.092-5.203 5.092-2.885 0-4.48-1.892-5.19-4.913-1.885 3.377-4.641 4.913-6.754 4.913-3.302 0-4.08-2.441-4-4.917-1.328 2.345-3.882 4.917-6.331 4.917-2.501 0-3.384-2.177-3.182-4.712-1.498 2.791-4.208 4.712-6.82 4.712-2.836 0-4.239-2.252-3.785-5.044-1.907 2.344-5.458 5.044-9.149 5.044-4.209 0-6.04-2.27-6.258-5.114-2.031 3.256-4.77 5.224-8.03 5.224-4.709 0-6.393-4.187-6.638-7.611a111 111 0 0 1-6.113 7.464c-.256.257-.476.403-.732.403C1.832 26.6.11 22.862 0 21.47c.723-1.121 5.281-6.13 8.95-10.161 1.29-1.417 2.471-2.714 3.336-3.679-2.247.678-4.564 2.03-7.486 4.132-.513.366-1.942-2.968-1.906-5.533 3.371-2.49 8.5-4.066 12.64-4.066 5.79 0 9.123 3.224 9.123 7.694 0 3.737-3.114 7.84-7.657 7.987-2.362.061-3.876-1.265-4.65-2.902.092 2.532 1.409 5.65 4.943 5.65 3.853 0 5.704-2.326 8.463-5.795q.269-.339.55-.69c2.345-2.895 5.056-5.46 9.013-5.46 2.418 0 4.067 1.503 4.067 3.774 0 2.748-3.224 6.558-7.73 6.558-.77 0-1.472-.101-2.064-.301q-.024.173-.025.338c0 1.282.476 2.052 2.565 2.052 3.077 0 5.971-1.832 9.489-6.119 3.444-4.213 6.045-6.045 8.793-6.045 1.855 0 3.262 1.005 3.883 2.698C57.98 6.283 61.104 2.514 63.75 0c2.601 1.1 4.47 3.26 3.957 3.7-1.942 1.76-8.427 8.83-10.991 13.044-.66 1.099-1.283 2.308-1.283 2.894 0 .55.33.733.696.733 1.76 0 5.289-4.156 8.336-7.746 1.138-1.34 2.209-2.602 3.095-3.539 2.052.843 4.14 2.638 3.627 3.261-2.71 3.224-4.762 5.862-4.762 7.364 0 .403.146.66.696.66 1.026 0 1.978-.916 3.554-2.858.33-.403.732-.403.989.22.696 1.685 1.722 2.601 2.528 2.601.952 0 1.429-.843 1.429-2.125 0-.876-.107-1.895-.2-2.772-.069-.664-.13-1.246-.13-1.624m-59.096-.477c1.942 0 4.067-1.062 4.067-3.224 0-1.312-.814-2.521-2.99-2.89l-.342.535c-1.106 1.729-2.149 3.359-3.2 4.953.63.354 1.427.626 2.465.626m19.638.66c0-.587-.367-.99-.953-.99-1.47 0-3.687 2.063-4.73 4.055.385.15.837.232 1.323.232 2.601 0 4.36-1.978 4.36-3.297m9.636 5.312c0 .66.366 1.1 1.135 1.1 2.382 0 5.35-4.324 5.35-6.083 0-.732-.403-1.172-1.063-1.172-2.162 0-5.422 4.103-5.422 6.155M76.06 6.082c-.843 1.392-2.125 2.968-2.601 3.444-2.199-.916-4.25-2.748-3.957-3.26.806-1.43 2.125-2.968 2.601-3.445 2.198.916 4.25 2.785 3.957 3.261"/>
  </svg>
  <h1>IRIS Support Agent</h1>
  <div class="session-bar">
    <label>Session</label>
    <input id="session-id" type="text" value="web_session" placeholder="session id" />
    <label>User</label>
    <input id="user-id" type="text" value="web_user" placeholder="user id" />
    <button id="ok-btn">OK</button>
  </div>
</header>

<div class="page-wrapper">
<div id="session-prompt">Enter a Session ID and User ID above, then click OK to start chatting.</div>
<div id="messages" style="display:none"></div>

<div id="input-area" class="chat-disabled">
  <div class="input-box">
    <textarea id="user-input" rows="2" placeholder="Message the agent..."></textarea>
    <div class="input-footer">
      <span class="hint">Press Enter to send</span>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>
</div>

<script>
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('user-input');
  const sendBtn      = document.getElementById('send-btn');
  const sessionEl    = document.getElementById('session-id');
  const userEl       = document.getElementById('user-id');
  const okBtn        = document.getElementById('ok-btn');
  const inputArea    = document.getElementById('input-area');
  const sessionPrompt = document.getElementById('session-prompt');

  let busy = false;
  let sessionConfirmed = false;

  function confirmSession() {
    if (!sessionEl.value.trim() || !userEl.value.trim()) {
      sessionEl.style.borderColor = sessionEl.value.trim() ? '' : '#7a1f1f';
      userEl.style.borderColor    = userEl.value.trim()    ? '' : '#7a1f1f';
      return;
    }
    sessionEl.style.borderColor = '';
    userEl.style.borderColor    = '';
    sessionEl.readOnly = true;
    userEl.readOnly    = true;
    sessionConfirmed   = true;

    sessionPrompt.style.display = 'none';
    messagesEl.style.display    = 'flex';
    inputArea.classList.remove('chat-disabled');
    okBtn.textContent  = 'Reset';
    inputEl.focus();
  }

  function resetSession() {
    sessionEl.readOnly = false;
    userEl.readOnly    = false;
    sessionConfirmed   = false;

    messagesEl.innerHTML        = '';
    messagesEl.style.display    = 'none';
    sessionPrompt.style.display = 'flex';
    inputArea.classList.add('chat-disabled');
    okBtn.textContent = 'OK';
    sessionEl.focus();
  }

  okBtn.addEventListener('click', () => {
    sessionConfirmed ? resetSession() : confirmSession();
  });

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBubble(role, text, source) {
    const row = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const BADGE_LABELS = { cache: 'Cached', faq: 'FAQ', rejected: 'Blocked' };
    if (source && source !== 'llm') {
      const badge = document.createElement('div');
      badge.className = `badge ${source}`;
      badge.textContent = BADGE_LABELS[source] || source;
      bubble.appendChild(badge);
    }

    const textNode = document.createElement('span');
    textNode.textContent = text;
    bubble.appendChild(textNode);

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'bubble-row assistant';
    row.innerHTML = `
      <div class="bubble status">
        <span>Thinking</span>
        <div class="dot-pulse">
          <span></span><span></span><span></span>
        </div>
      </div>`;
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addBubble('user', text);

    const thinkingRow = addThinking();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          session_id: sessionEl.value || 'web_session',
          user_id:    userEl.value    || 'web_user',
        }),
      });

      thinkingRow.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        addBubble('assistant', `Error: ${err.detail}`, 'rejected');
      } else {
        const data = await res.json();
        addBubble('assistant', data.response, data.source);
      }
    } catch (e) {
      thinkingRow.remove();
      addBubble('assistant', `Network error: ${e.message}`, 'rejected');
    }

    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
  inputEl.focus();
</script>
</body>
</html>
